name: Aggiorna calendario automaticamente

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: italian-tennis-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cerca partite e risultati
        run: node scripts/update-calendar.mjs

      - name: Valida il file iCalendar
        run: node scripts/validate-calendar.mjs

      - name: Pubblica solo se è cambiato qualcosa
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessun aggiornamento da pubblicare."
            exit 0
          fi
          git config user.name "italian-tennis-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics index.html
          git commit -m "Aggiorna automaticamente partite e risultati"
          git push
